plugins {
    id 'com.android.application'
}

def releaseBuildNumber = providers.gradleProperty('releaseBuildNumber').map { it.toInteger() }.orElse(0).get()

android {
    namespace 'com.you.reelguard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.you.reelguard'
        minSdk 29
        targetSdk 34
        versionCode (1 + releaseBuildNumber)
        versionName (releaseBuildNumber == 0 ? '0.1.0' : '0.1.0+' + releaseBuildNumber)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'junit:junit:4.13.2'
}
