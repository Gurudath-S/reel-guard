name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Test and build release
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease "-PreleaseBuildNumber=$GITHUB_RUN_NUMBER"

      - name: Sign and verify APK
        env:
          REELGUARD_KEYSTORE_BASE64: ${{ secrets.REELGUARD_KEYSTORE_BASE64 }}
          REELGUARD_KEYSTORE_PASSWORD: ${{ secrets.REELGUARD_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$REELGUARD_KEYSTORE_BASE64" || -z "$REELGUARD_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure the ReelGuard signing secrets before publishing."
            exit 1
          fi

          umask 077
          keystore="$(mktemp "${RUNNER_TEMP}/reelguard.XXXXXX")"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$REELGUARD_KEYSTORE_BASE64" | base64 --decode > "$keystore"

          build_tools="$ANDROID_HOME/build-tools/34.0.0"
          aligned="$RUNNER_TEMP/reelguard-aligned.apk"
          "$build_tools/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$aligned"
          "$build_tools/apksigner" sign --ks "$keystore" --ks-type PKCS12 --ks-key-alias reelguard \
            --ks-pass env:REELGUARD_KEYSTORE_PASSWORD --key-pass env:REELGUARD_KEYSTORE_PASSWORD \
            --out reelguard.apk "$aligned"
          "$build_tools/apksigner" verify --verbose reelguard.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$GITHUB_RUN_NUMBER"
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq reelguard.apk; then
            echo "Release $tag already has its APK."
            exit 0
          fi

          latest=()
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" != "$GITHUB_SHA" ]]; then
            latest=(--latest=false)
          fi
          gh release create "$tag" reelguard.apk --target "$GITHUB_SHA" \
            --title "ReelGuard build $GITHUB_RUN_NUMBER" --generate-notes "${latest[@]}"
